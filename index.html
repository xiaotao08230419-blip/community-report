<title>社区内容看板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #2d1b2e 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  .lock { background: rgba(255,255,255,.06); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 20px;
    padding: 40px 44px; text-align: center; color: #eee; width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .lock .icon { font-size: 42px; margin-bottom: 12px; }
  .lock h1 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .lock p { font-size: 12px; color: #999; margin-bottom: 22px; }
  .lock input { width: 100%; padding: 11px 14px; border-radius: 10px; font-size: 14px;
    border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.08);
    color: #fff; outline: none; text-align: center; letter-spacing: 1px; }
  .lock input:focus { border-color: #e0354f; }
  .lock button { width: 100%; margin-top: 14px; padding: 11px 0; border: none; border-radius: 10px;
    background: linear-gradient(90deg, #e0354f, #c41230); color: #fff; font-size: 14px;
    cursor: pointer; font-family: inherit; }
  .lock button:active { transform: scale(.98); }
  .err { color: #ff8a9a; font-size: 12px; margin-top: 12px; min-height: 16px; }
  .spin { display: inline-block; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>

function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
async function unlockWithKey(key){
  var raw = b64(PAYLOAD);
  var plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64(IV), tagLength: 128 }, key, raw);
  var html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
function saveKey(key){
  crypto.subtle.exportKey('raw', key).then(function(buf){
    var b = btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
    try { localStorage.setItem('dash_key', JSON.stringify({ k: b, exp: Date.now() + 30*86400000 })); } catch(e){}
  });
}
async function tryAuto(){
  try {
    var s = JSON.parse(localStorage.getItem('dash_key') || 'null');
    if (!s || !s.k || Date.now() > s.exp) return;
    var key = await crypto.subtle.importKey('raw', b64(s.k), { name: 'AES-GCM' }, true, ['decrypt']);
    await unlockWithKey(key);
  } catch(e) { /* 密钥失效或已改密码，回落到密码页 */ }
}
async function unlock(){
  var err = document.getElementById('err');
  var btn = document.getElementById('go');
  err.textContent = '';
  var pw = document.getElementById('pw').value;
  if (!pw) { err.textContent = '请输入密码'; return; }
  btn.innerHTML = '<span class="spin">⏳</span> 解密中…'; btn.disabled = true;
  try {
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(SALT), iterations: 150000, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    await unlockWithKey(key);
    saveKey(key); // 记住 30 天（存的是密钥，不是明文密码）
  } catch (e) {
    err.textContent = '密码不对，再试一次';
    btn.textContent = '解锁看板'; btn.disabled = false;
  }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') unlock(); });
tryAuto();
</script>
